# zmod_pushraker: pushraker push notifications for Zmod (README.md).
#
# pushraker's own macros come from the package. It takes its print-end
# and cancel snapshots when _PRINT_END_NTFY / _CANCEL_PRINT_NTFY run,
# which must be before the printer parks:
#   - print end: Zmod's END_PRINT starts with _NOTIFY TYPE=end, an empty
#     hook in Zmod's base.cfg (the notify plugin fills it). This file
#     fills it with pushraker's print-end hook instead.
#   - cancel: Zmod's CANCEL_PRINT has no such hook, so [pushraker_hooks]
#     (klipper/pushraker_hooks.py, linked into Klipper's extras by
#     install.sh) runs _PUSHRAKER_CANCEL at its start. Zmod's CANCEL_PRINT
#     runs twice (it passes the cancel to the native screen, which sends
#     it back), so the hook only fires on the first call.
# The settings page on port 82 is a second nginx (web.sh), started at
# every Klipper start.

[include python/pushraker/klipper/pushraker.cfg]

[gcode_macro _NOTIFY]
gcode:
    {% if params.TYPE|default("")|lower == "end" %}
        _PRINT_END_NTFY
    {% endif %}

[pushraker_hooks]
wrap: CANCEL_PRINT=_PUSHRAKER_CANCEL

[gcode_macro _PUSHRAKER_CANCEL]
description: pushraker's cancel hook, once per cancel (zmod_pushraker)
gcode:
    {% set first = printer["gcode_macro _CANCEL_PRINT"].cancel_send|default(0)|int == 0
        if "gcode_macro _CANCEL_PRINT" in printer else True %}
    {% if first and printer.print_stats.state in ["printing", "paused"] %}
        _CANCEL_PRINT_NTFY
    {% endif %}

[gcode_shell_command zmod_pushraker_web]
command: /opt/config/mod_data/plugins/zmod_pushraker/web.sh
timeout: 30
verbose: True

[delayed_gcode _PUSHRAKER_WEB_START]
initial_duration: 5
gcode:
    RUN_SHELL_COMMAND CMD=zmod_pushraker_web PARAMS=start

[gcode_macro PUSHRAKER_WEB]
description: pushraker's settings page on port 82: status (STOP=1 stops it)
gcode:
    {% if params.STOP|default(0)|int %}
        RUN_SHELL_COMMAND CMD=zmod_pushraker_web PARAMS=stop
    {% else %}
        RUN_SHELL_COMMAND CMD=zmod_pushraker_web PARAMS=status
    {% endif %}
